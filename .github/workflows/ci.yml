name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Tidy
        run: go mod tidy
      - name: Test
        run: go test ./internal/quant/ ./internal/strategies/... ./internal/saas/... ./internal/agent/... -count=1
      - name: Build binaries
        run: |
          go build -o bin/saas ./cmd/saas
          go build -o bin/agent ./cmd/agent
          go build -o bin/seed ./cmd/seed
      - name: Verify go.sum present
        run: test -f go.sum
